<a href="https://github.com/libsdl-org/SDL_ttf/blob/main/include/SDL3_ttf/SDL_ttf.h">SDL3_ttf/SDL_ttf.h</a>
<h2>構文</h2>
<code>int TTF_Version(void);</code>
<h2>戻り値</h2>
(int) SDL_ttfのバージョンを戻す.
<h2>スレッドセーフ</h2>

この関数はどのスレッドからも安全に呼べる.
